<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계좌별 상세내역 관리</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --border-color: #e5e7eb;
      --bg-hover: #f9fafb;
      --text-positive: #dc2626;
      --text-negative: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-add:hover {
      background-color: #1d4ed8;
    }

    .btn-delete {
      background-color: #ef4444;
      color: white;
      padding: 6px 12px;
      font-size: 0.875rem;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }

    /* 입력창 스타일 */
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* 수치 필드 우측 정렬 */
    .text-right {
      text-align: right;
    }

    .positive { color: var(--text-positive); font-weight: 600; }
    .negative { color: var(--text-negative); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>계좌별 상세내역</h2>
    <button id="btn-add-row" class="btn btn-add">+ 항목 추가</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 16%;">계좌명</th>
          <th style="width: 16%;">종목명</th>
          <th style="width: 15%; text-align: right;">매입금액</th>
          <th style="width: 15%; text-align: right;">평가금액</th>
          <th style="width: 14%; text-align: right;">손익</th>
          <th style="width: 12%; text-align: right;">수익률</th>
          <th style="width: 12%; text-align: center;">작업</th>
        </tr>
      </thead>
      <tbody id="account-tbody">
        <!-- 스크립트를 통해 초기 데이터 동적 생성 -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // 1. 초기 상태 데이터 정의 (localStorage 연동)
  const STORAGE_KEY = 'account_details_data';
  let accountData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { id: Date.now(), accountName: '키움증권', stockName: '삼성전자', purchasePrice: 70000, evalPrice: 75000 },
    { id: Date.now() + 1, accountName: ' 미래에셋', stockName: 'NAVER', purchasePrice: 210000, evalPrice: 195000 }
  ];

  const tbody = document.getElementById('account-tbody');
  const btnAddRow = document.getElementById('btn-add-row');

  // 2. 초기 렌더링 함수 (페이지 로드 시, 행 추가 및 삭제 시에만 호출)
  function renderTable() {
    tbody.innerHTML = accountData.map(item => createRowHTML(item)).join('');
  }

  // 행 HTML 생성 헬퍼 함수
  function createRowHTML(item) {
    const profit = item.evalPrice - item.purchasePrice;
    const returnRate = item.purchasePrice > 0 ? ((profit / item.purchasePrice) * 100).toFixed(2) : '0.00';
    const profitClass = profit > 0 ? 'positive' : profit < 0 ? 'negative' : '';

    return `
      <tr data-id="${item.id}">
        <td>
          <input type="text" class="input-field input-account-name" value="${escapeHtml(item.accountName)}" placeholder="계좌명">
        </td>
        <td>
          <input type="text" class="input-field input-stock-name" value="${escapeHtml(item.stockName)}" placeholder="종목명">
        </td>
        <td>
          <input type="number" class="input-field input-purchase-price text-right" value="${item.purchasePrice || ''}" placeholder="0">
        </td>
        <td>
          <input type="number" class="input-field input-eval-price text-right" value="${item.evalPrice || ''}" placeholder="0">
        </td>
        <td class="text-right cell-profit ${profitClass}">
          ${profit > 0 ? '+' : ''}${profit.toLocaleString()}
        </td>
        <td class="text-right cell-return-rate ${profitClass}">
          ${profit > 0 ? '+' : ''}${returnRate}%
        </td>
        <td style="text-align: center;">
          <button class="btn btn-delete">삭제</button>
        </td>
      </tr>
    `;
  }

  // HTML 특수문자 치환 (XSS 방지)
  function escapeHtml(text) {
    return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // 3. 핵심: 이벤트 위임(Event Delegation)을 통한 실시간 입력 처리
  // **입력 중 DOM(innerHTML)을 재생성하지 않고 포커스를 완전하게 유지합니다.**
  tbody.addEventListener('input', (e) => {
    const target = e.target;
    if (!target.classList.contains('input-field')) return;

    const tr = target.closest('tr');
    if (!tr) return;

    const itemId = Number(tr.dataset.id);
    const item = accountData.find(d => d.id === itemId);
    if (!item) return;

    // A. 입력 대상에 따른 데이터 모델 갱신
    if (target.classList.contains('input-account-name')) {
      item.accountName = target.value;
    } else if (target.classList.contains('input-stock-name')) {
      item.stockName = target.value;
    } else if (target.classList.contains('input-purchase-price')) {
      item.purchasePrice = Number(target.value) || 0;
    } else if (target.classList.contains('input-eval-price')) {
      item.evalPrice = Number(target.value) || 0;
    }

    // B. 손익 및 수익률 실시간 단일 DOM 갱신 (전체 렌더링 X, 깜빡임 방지)
    const profit = item.evalPrice - item.purchasePrice;
    const returnRate = item.purchasePrice > 0 ? ((profit / item.purchasePrice) * 100).toFixed(2) : '0.00';
    const profitClass = profit > 0 ? 'positive' : profit < 0 ? 'negative' : '';

    const profitCell = tr.querySelector('.cell-profit');
    const returnRateCell = tr.querySelector('.cell-return-rate');

    if (profitCell && returnRateCell) {
      profitCell.textContent = `${profit > 0 ? '+' : ''}${profit.toLocaleString()}`;
      returnRateCell.textContent = `${profit > 0 ? '+' : ''}${returnRate}%`;

      profitCell.className = `text-right cell-profit ${profitClass}`;
      returnRateCell.className = `text-right cell-return-rate ${profitClass}`;
    }

    // C. localStorage에 실시간 백그라운드 저장
    saveToStorage();
  });

  // 4. 행 추가 처리
  btnAddRow.addEventListener('click', () => {
    const newItem = {
      id: Date.now(),
      accountName: '',
      stockName: '',
      purchasePrice: 0,
      evalPrice: 0
    };
    accountData.push(newItem);
    saveToStorage();

    // DOM에 새로운 행만 Append하여 기존 input의 포커스 상태 영향 최소화
    const tempWrapper = document.createElement('tbody');
    tempWrapper.innerHTML = createRowHTML(newItem);
    const newTr = tempWrapper.firstElementChild;
    tbody.appendChild(newTr);

    // 새 행의 첫 번째 입력창으로 포커스 이동
    newTr.querySelector('.input-account-name').focus();
  });

  // 5. 행 삭제 처리
  tbody.addEventListener('click', (e) => {
    if (!e.target.classList.contains('btn-delete')) return;

    const tr = e.target.closest('tr');
    if (!tr) return;

    const itemId = Number(tr.dataset.id);
    accountData = accountData.filter(item => item.id !== itemId);
    saveToStorage();

    // 전체를 다시 그리지 않고 해당 행만 DOM에서 직접 제거
    tr.remove();
  });

  // 6. 데이터 저장 함수
  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(accountData));
  }

  // 앱 실행 시 초기화
  renderTable();
</script>

</body>
</html>
